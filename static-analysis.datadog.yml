# Target path in your fork: static-analysis.datadog.yml (repo root) — REPLACES the shipped file.
#
# Upstream pins 49 rulesets across 10 languages. You are keeping python (+ java/pom.xml),
# so trim to match: faster scans, fewer findings in the shared org, and a demo that
# cannot change shape because Datadog shipped a new JavaScript rule the week of your talk.
#
# If you decide to drop java/ entirely, remove the three java-* lines too.

schema-version: v1
rulesets:
  - python-security
  - python-best-practices
  - python-code-style
  - python-django
  - python-flask
  - python-inclusive
  - java-security
  - java-best-practices
  - java-code-style
  - docker-best-practices
  - github-actions
ignorePaths:
  - .github/**
