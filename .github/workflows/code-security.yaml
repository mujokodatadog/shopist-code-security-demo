# Target path in your fork: .github/workflows/code-security.yml
#
# Datadog Code Security for the PIDI 2026 demo.
# Sends SAST, Secret Scanning, SCA and IaC findings to dpndemo, then reports
# the pipeline result to CI Visibility so the gate is visible in Datadog.
#
# Requires repo secrets: DD_API_KEY, DD_APP_KEY (app key needs code_analysis_read scope)
# NOTE: the static analyzer action supports the `push` trigger only. pull_request is unsupported.

name: Datadog Code Security

on:
  push:
    branches: ['**']

permissions:
  contents: read

jobs:
  sast-and-secrets:
    runs-on: ubuntu-latest
    name: SAST + Secret Scanning
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Upload git metadata
        env:
          DD_API_KEY: ${{ secrets.DD_API_KEY }}
          DD_APP_KEY: ${{ secrets.DD_APP_KEY }}
          DD_SITE: datadoghq.com
        run: |
          npm install -g @datadog/datadog-ci
          datadog-ci git-metadata upload

      - name: Datadog static analysis and secret scanning
        uses: DataDog/datadog-static-analyzer-github-action@v3
        with:
          dd_api_key: ${{ secrets.DD_API_KEY }}
          dd_app_key: ${{ secrets.DD_APP_KEY }}
          dd_site: "datadoghq.com"
          cpu_count: 2
          secrets_enabled: true
          # Full scan every push keeps the demo deterministic. Set to true once
          # you are happy, if you want faster feature-branch scans.
          diff_aware: false

  sca:
    runs-on: ubuntu-latest
    name: Software Composition Analysis
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Datadog SCA
        uses: DataDog/datadog-sca-github-action@v4
        with:
          dd_api_key: ${{ secrets.DD_API_KEY }}
          dd_app_key: ${{ secrets.DD_APP_KEY }}
          dd_site: "datadoghq.com"

  iac:
    runs-on: ubuntu-latest
    name: IaC Security
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Scan Terraform and upload results
        env:
          DD_API_KEY: ${{ secrets.DD_API_KEY }}
          DD_APP_KEY: ${{ secrets.DD_APP_KEY }}
          DD_SITE: datadoghq.com
        run: |
          npm install -g @datadog/datadog-ci
          curl -sSL "https://github.com/DataDog/datadog-iac-scanner/releases/latest/download/datadog-iac-scanner_linux_amd64.tar.gz" \
            -o /tmp/iac-scanner.tar.gz
          tar xfz /tmp/iac-scanner.tar.gz -C /tmp
          sudo mv /tmp/datadog-iac-scanner /usr/local/bin/datadog-iac-scanner

          # Exit codes 20-60 mean "findings were detected", not "the scan broke".
          exit_code=0
          datadog-iac-scanner scan -p . -o /tmp || exit_code=$?
          if [ "$exit_code" -lt 20 ] || [ "$exit_code" -gt 60 ]; then
            echo "IaC scan failed with exit code $exit_code"
            exit "$exit_code"
          fi

          datadog-ci sarif upload /tmp/datadog-iac-scanner-result.sarif

  # security-gate:
  #   runs-on: ubuntu-latest
  #   name: Security gate
  #   needs: [sast-and-secrets, sca, iac]
  #   steps:
  #     - name: Checkout
  #       uses: actions/checkout@v4

  #     - name: Block the build on leaked credentials
  #       run: |
  #         echo "Checking for credential patterns in source..."
  #         if grep -rEIl \
  #             -e 'sk_live_[0-9a-zA-Z]{8}' \
  #             -e 'AKIA[0-9A-Z]{16}' \
  #             -e '-----BEGIN RSA PRIVATE KEY-----' \
  #             . --exclude-dir=.git --exclude-dir=.github ; then
  #           echo "::error::SECURITY GATE FAILED - credentials detected in source. Blocking."
  #           exit 1
  #         fi
  #         echo "Security gate passed - no credential patterns found."

  report-to-datadog:
    runs-on: ubuntu-latest
    name: Report pipeline to Datadog
    needs: [sast-and-secrets, sca, iac]
    if: always()
    steps:
      - name: Send CI pipeline event
        env:
          DD_API_KEY: ${{ secrets.DD_API_KEY }}
          GATE_RESULT: ${{ needs.security-gate.result }}
        run: |
          if [ "$GATE_RESULT" = "success" ]; then STATUS="success"; else STATUS="error"; fi

          UUID="$(cat /proc/sys/kernel/random/uuid)"
          END="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          # Approximate start; good enough for the demo view.
          START="$(date -u -d '-3 minutes' +%Y-%m-%dT%H:%M:%SZ)"

          echo "Reporting pipeline as ${STATUS}"

          curl -sS -X POST "https://api.datadoghq.com/api/v2/ci/pipeline" \
            -H "Content-Type: application/json" \
            -H "DD-API-KEY: ${DD_API_KEY}" \
            -d @- << EOF
          {
            "data": {
              "type": "cipipeline_resource_request",
              "attributes": {
                "provider_name": "github-actions",
                "resource": {
                  "level": "pipeline",
                  "unique_id": "${UUID}",
                  "name": "pidi-payments-api security gate",
                  "git": {
                    "repository_url": "https://github.com/${GITHUB_REPOSITORY}",
                    "author_email": "mujoko.mujoko@datadoghq.com",
                    "sha": "${GITHUB_SHA}"
                  },
                  "status": "${STATUS}",
                  "start": "${START}",
                  "end": "${END}",
                  "partial_retry": false,
                  "url": "https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
                }
              }
            }
          }
          EOF
